version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # 2026-09-28 (build #246/#247 size failures): pdfjs-dist ships
        # pdf.worker.mjs.map, a ~5MB debug sourcemap with zero runtime
        # purpose (see the serverExternalPackages/outputFileTracingIncludes
        # comment block in next.config.mjs -- Next's tracer pulls a traced
        # file's sibling .map in automatically even though only
        # pdf.worker.mjs itself is named there). It is traced into BOTH
        # outputFileTracingIncludes routes independently (~10.5MB total),
        # confirmed via each route's own .next/server/**/route.js.nft.json.
        # An earlier incident (2026-09-06, see next.config.mjs) considered
        # excluding it via outputFileTracingExcludes and dropped the idea
        # only because it "did not visibly take effect" in local
        # verification, with ample margin (~29MB) to not need it anyway.
        # This time there is no such margin (build #246/#247 failed by only
        # ~2.95MB), so this deletes the source .map file outright, in
        # preBuild before `next build` ever runs its tracer -- Next cannot
        # trace a sibling file that does not exist, regardless of whichever
        # exclude-glob mechanism did or didn't work before. pdf.worker.mjs
        # itself (the actual 2MB file every real PDF/CAS/bank-statement
        # upload needs) is untouched; only its debug sourcemap is removed.
        - rm -f node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs.map
        # Amplify's build image is Amazon Linux (no apt-get), so Playwright's
        # --with-deps flag (which only knows apt-based distros) fails outright.
        # Install Chromium's runtime shared libraries via yum instead, then
        # install just the browser binary (no --with-deps).
        - sudo yum install -y atk at-spi2-atk cups-libs gtk3 libXcomposite libXcursor libXdamage libXext libXi libXrandr libXScrnSaver libXtst pango alsa-lib nss nspr mesa-libgbm
        - npx playwright install chromium
    build:
      commands:
        # Root cause of "env var visible in Amplify console but process.env
        # shows undefined at runtime": per AWS's own Amplify Hosting docs
        # ("Making environment variables accessible to server-side
        # runtimes"), a Next.js server component/route handler has NO
        # access to console-configured environment variables by default —
        # only NEXT_PUBLIC_* vars get inlined automatically (at compile
        # time, which is why those "worked" while every server-only secret
        # silently didn't, across multiple redeploys — no redeploy fixes
        # this, only build-script changes do). Everything else must be
        # explicitly written into .env.production so it ships inside the
        # deployed artifact and Next.js's own runtime env-loading picks it
        # up. Add new server-only var names to this grep list as they're
        # introduced (SUPABASE_SERVICE_ROLE_KEY/CRON_SECRET/APP_BASE_URL
        # were already broken before RESEND_API_KEY/CONTACT_FROM_EMAIL
        # surfaced the same gap for the Contact page).
        #
        # G8 closure (2026-09-13): G4_APP_CAPABILITY_LAYER_ENABLED,
        # G5B_GENERIC_WRITE_ENABLED, G2_LANDING_LOCALISATION_ENABLED,
        # G2_ALLOW_TEST_DETECTION_HEADER and the new ROLLOUT_* rollout-cohort
        # variables were NEVER on this list -- confirmed live, not assumed:
        # a real disposable synthetic GENERIC production user got
        # GENERIC_EXPERIENCE_RESTRICTED (the LEGACY flag-off refusal reason,
        # not a manifest-driven one) from the real running app, proving
        # G4_APP_CAPABILITY_LAYER_ENABLED was effectively OFF at runtime
        # regardless of its Amplify console value. This means the entire
        # G4/G5B GENERIC-write application-layer feature has likely never
        # actually been reachable by a real user through the real app,
        # despite being "enabled" in the console — only the database-layer
        # grant (migration 0129, unconditional once applied, independent of
        # these flags) has ever been live. Adding them here is what actually
        # makes the console configuration take effect for the first time.
        #
        # AIE-1 terminal certification, M5 (2026-09-15): NO `AIE_*` variable
        # was on this list either -- the same defect class as G4/G5B above,
        # found by auditing Part L.9's "production rollout gate" requirement
        # rather than by an incident. The 27 AIE_* variables include the
        # global intake kill switch (AIE_DOCUMENT_INTAKE_ENABLED), the
        # per-adapter enablement flags, the provider kill switch
        # (AIE_AI_FALLBACK_ENABLED), the pilot-cohort allowlist
        # (AIE_PILOT_COHORT_*) and the two AIE secrets.
        #
        # WHY THIS IS NOT MERELY COSMETIC, AND WHY A PARTIAL FIX WOULD BE
        # WORSE THAN NONE. Every AIE flag defaults OFF when unset, so the
        # CURRENT state is fail-safe: AIE is simply unreachable in production
        # no matter what the console says. The danger is the partial
        # remediation. `isUserInAiePilotCohort()` returns TRUE for everyone
        # when `AIE_PILOT_COHORT_ENFORCED` is unset -- that is deliberate
        # (two independent toggles), and it is correct when both variables
        # travel together. If a future operator added only
        # AIE_DOCUMENT_INTAKE_ENABLED to this list, intake would switch on
        # while cohort enforcement stayed silently OFF, turning an
        # allowlisted pilot into a rollout to every user -- a FAIL-OPEN
        # combination. Forwarding the whole `AIE_` prefix is what keeps the
        # kill switch and its allowlist inseparable.
        #
        # No AIE flag is SET in any environment today, so adding the prefix
        # changes nothing about what is currently enabled; it makes the
        # rollout gate operable for the first time, which Part L.9 requires
        # before any production activation.
        #
        # Live Recovery independent audit (2026-09-21): NO `STRIPE_` or
        # `RAZORPAY_` variable was on this list either -- the same defect
        # class as G4/G5B and AIE_ above, found by reading this file
        # directly rather than trusting a payments-flow claim. Confirmed by
        # reading the consumers (lib/services/payments/stripeClient.ts,
        # razorpayClient.ts, lib/services/paymentPlanCatalogue.ts, both
        # webhook routes): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, the
        # STRIPE_PRICE_ID_PREMIUM_* AU plan ids, RAZORPAY_KEY_ID,
        # RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET and the
        # RAZORPAY_PLAN_ID_PREMIUM_* IN plan ids were all silently absent
        # from the deployed runtime regardless of Amplify console value.
        # Unlike the AIE_ case, this fails toward an outage rather than a
        # fail-open security gap -- getStripeClient() returns null (never
        # throws, never uses an undefined/bad key) when the secret is
        # missing -- but the practical effect is the same: Stripe/Razorpay
        # checkout and webhook processing were very likely completely
        # non-functional in production. Forwarding the whole prefix (not
        # just today's known var names) avoids this recurring a fourth time
        # the next time a new STRIPE_*/RAZORPAY_* var is introduced.
        #
        # M13A/2026-09-21 fix (the OLD, pre-AIE Investment Intelligence
        # AI-fallback path): `II_AI_FALLBACK_ENABLED`
        # (lib/services/investment-intelligence/aiFallbackFeatureFlag.ts) does
        # not contain the substring `AIE_` (it is spelled `II_`, for
        # "Investment Intelligence", not the AIE-1 gateway's own prefix), so
        # the existing `-e AIE_` term never matched it -- the exact same
        # defect class as every occurrence above. This same fix also adds
        # this path's own pilot-cohort gate,
        # `II_AI_FALLBACK_PILOT_COHORT_ENFORCED` /
        # `II_AI_FALLBACK_PILOT_COHORT_USER_IDS` /
        # `II_AI_FALLBACK_PILOT_COHORT_EMAILS`, and the SAME fail-open trap
        # documented above for AIE_ applies here too: forwarding only
        # `II_AI_FALLBACK_ENABLED` without its paired cohort-enforcement
        # variables would let the AI-fallback kill switch be turned on from
        # the console while cohort enforcement stayed silently unforwardable
        # (and therefore permanently OFF) -- turning an intended allowlisted
        # pilot into a rollout to every user. Using the whole `II_AI_FALLBACK_`
        # prefix (rather than each variable by exact name) keeps the kill
        # switch and its allowlist inseparable, exactly like the `AIE_` prefix
        # does for that pipeline. Every one of these flags still defaults OFF
        # when unset, so today's production behaviour is unchanged either
        # way; this only makes the switches operable at all.
        #
        # Premium promo codes / expiry e-mails (2026-10-01): `PROMO_IP_HASH_SECRET`
        # (the HMAC key for the per-IP redemption rate limit, falls back to
        # CRON_SECRET above) and `PREMIUM_REMINDER_FROM_EMAIL` (optional sender for
        # the expiry reminder e-mails, falls back to CONTACT_FROM_EMAIL above) were
        # new server-only names that would NOT have reached the runtime without
        # being listed -- without PROMO_IP_HASH_SECRET AND without CRON_SECRET the
        # per-IP limit silently turns off (the per-user limit still applies). The
        # `PREMIUM_REMINDER_` prefix is forwarded as a whole so any future paired
        # variable for that job travels with it. (The reminder job's own kill
        # switch is a database row, not an environment variable, and ships OFF.)
        - env | grep -e SUPABASE_SERVICE_ROLE_KEY -e CRON_SECRET -e APP_BASE_URL -e RESEND_API_KEY -e CONTACT_FROM_EMAIL -e PROMO_IP_HASH_SECRET -e PREMIUM_REMINDER_ -e G4_APP_CAPABILITY_LAYER_ENABLED -e G5B_GENERIC_WRITE_ENABLED -e G2_LANDING_LOCALISATION_ENABLED -e G2_ALLOW_TEST_DETECTION_HEADER -e ROLLOUT_ -e AIE_ -e STRIPE_ -e RAZORPAY_ -e II_AI_FALLBACK_ >> .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        # 2026-09-19: the last two deploys both failed here with
        # "FATAL ERROR: Ineffective mark-compacts near heap limit ...
        # JavaScript heap out of memory" -> "Next.js build worker exited
        # with code: null and signal: SIGABRT" (confirmed from the actual
        # Amplify build logs, not assumed). Root cause: the codebase has
        # grown substantially (the AIE-1/PC4-PC10 mission's own ~400 files
        # plus everything since) and Next.js's internal "Running TypeScript"
        # build step now exceeds Node's default old-space heap limit on this
        # build compute -- reproduced locally too, where the same crash was
        # fixed the same way. Never silently retried without this: two
        # consecutive production deploys already went out this way with
        # nobody aware production was still serving the OLD build until a
        # live user-facing feature 404'd and was traced back to it.
        - export NODE_OPTIONS="--max-old-space-size=5120"
        - npm run build
        # 2026-09-28: build #246 (the Approved Upload -> Canonical User Data
        # release) failed at the artifact-packaging step, AFTER production's
        # migrations for that release were already applied -- with the SAME
        # 230686720-byte ceiling as the 2026-09-06 pdf-worker incident above,
        # this time "size of the build output (233638935) exceeds the max
        # allowed size", an overage of only ~2.95MB. A from-scratch local
        # build of this exact commit (fresh node_modules, no restored cache)
        # produced a complete .next directory of only ~125MB -- under HALF
        # of what Amplify reported, and comfortably under the limit on its
        # own. The `cache.paths` entry below restores `.next/cache` from the
        # PREVIOUS build before every new one runs (to speed up incremental
        # compiles); that restored, ever-growing cache directory was never
        # excluded from `artifacts.files: ['**/*']`, so every deploy has
        # been shipping the accumulated incremental build cache as part of
        # the deployed artifact, not just the real build output -- and this
        # release (124 commits, 68,697 insertions across the whole
        # programme) was large and broad enough to finally tip it over.
        # Rather than rely on an unverified exclude-glob inside
        # `artifacts.files` (this repo's own 2026-09-06 incident above found
        # a `outputFileTracingExcludes` entry that "did not visibly take
        # effect" locally, root cause never confirmed -- Amplify's exact
        # glob-matching semantics for `files:` are similarly unconfirmed),
        # this deletes the cache directory outright, immediately before
        # Amplify packages `artifacts.files` from `baseDirectory: .next` --
        # an empty/missing directory cannot be included by any matcher,
        # regardless of its exact syntax. The cache is never read at
        # runtime, so this changes nothing the app serves; the only cost is
        # that the NEXT build after this one starts from an empty cache
        # (slower, not incorrect) and then repopulates it for the one after
        # that, same as this repo's very first build ever did.
        - rm -rf .next/cache
        # 2026-10-01 (build #270, merge cce323f): failed AGAIN at the
        # packaging step -- "size of the build output (232331902) exceeds the
        # max allowed size of 230686720 bytes", 1,645,182 bytes over, only
        # three merges after #269 (35956a7) had passed. Measured locally
        # (docs/ops/AMPLIFY_BUILD_SIZE_FIX_2026-10-01.md): of the ~128MB
        # `.next` that `next build` leaves behind (cache excluded), ~95MB
        # (74%) is Turbopack's SERVER sourcemaps -- `.next/server/chunks/
        # *.js.map`, 1,518 files, each carrying a full `sourcesContent` copy
        # of every module in its chunk (Next's own app-route.js template
        # alone is re-embedded 364 times, once per route). They have no
        # runtime purpose: Node only reads them under --enable-source-maps
        # to prettify stack traces, and Node silently ignores a
        # `//# sourceMappingURL` whose file is absent (verified with a local
        # `next start` under --enable-source-maps, see the doc above).
        # They are also exactly what grows with every new route/shared
        # module (the 3 merges behind #270 added 2.18MB of .map vs 0.51MB
        # of real chunk JS), which is why the limit keeps being hit. Browser
        # sourcemaps are not emitted (productionBrowserSourceMaps is false)
        # and .next/static is excluded below regardless, so a future opt-in
        # to browser maps is not silently dropped. Deleted here, after the
        # build and before Amplify packages `artifacts.files`, for the same
        # reason as the cache above: a file that does not exist cannot be
        # packaged, whatever the packager's glob semantics.
        - find .next -type f -name '*.map' -not -path '.next/static/*' -delete
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
